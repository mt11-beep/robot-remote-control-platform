<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Dual Video Monitor</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: rgba(23, 26, 33, 0.92);
      --panel-2: #161a22;
      --border: #2a2f3a;
      --text: #e6edf3;
      --subtext: #9aa4b2;
      --ok: #3fb950;
      --warn: #d29922;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.42);
      --accent1: #4f8cff;
      --accent2: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(79,140,255,0.08), transparent 24%),
        radial-gradient(circle at 80% 70%, rgba(34,211,238,0.08), transparent 24%),
        linear-gradient(180deg, #0c1016 0%, #11161d 100%);
      color: var(--text);
      font-family: Arial, "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      height: 68px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18, 22, 30, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--subtext);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--subtext);
      white-space: nowrap;
    }

    .pill.ok {
      color: var(--ok);
      border-color: rgba(63,185,80,0.35);
    }

    .pill.warn {
      color: var(--warn);
      border-color: rgba(210,153,34,0.35);
    }

    .main {
      flex: 1;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 0;
    }

    .card {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .card-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18, 22, 30, 0.88);
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .card-topic {
      font-size: 12px;
      color: var(--subtext);
      max-width: 60%;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(180deg, #000 0%, #050608 100%);
      position: relative;
    }

    .viewer img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      background: #000;
    }

    .viewer::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 80px rgba(0,0,0,0.22);
    }

    .card-footer {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(18, 22, 30, 0.88);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--subtext);
    }

    .footer-status.ok {
      color: var(--ok);
    }

    .footer-status.warn {
      color: var(--warn);
    }

    .bottom-bar {
      padding: 10px 16px;
      background: rgba(18, 22, 30, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--subtext);
    }

    @media (max-width: 1100px) {
      .main {
        grid-template-columns: 1fr;
      }

      .card-topic {
        max-width: 50%;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title-wrap">
      <div class="title">双路视频监控</div>
      <div class="subtitle">前置相机 + YOLO 调试图</div>
    </div>

    <div class="status-row">
      <div id="globalStatus" class="pill warn">● connecting</div>
      <div id="refreshInfo" class="pill">refresh: 100 ms</div>
      <div id="signalInfo" class="pill">signal: --</div>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-title">前置相机</div>
        <div class="card-topic">/camera/front_camera/color/image_raw/compressed</div>
      </div>
      <div class="viewer">
        <img id="frontFrame" alt="Front Camera">
      </div>
      <div class="card-footer">
        <div>来源：front_snapshot.jpg</div>
        <div id="frontStatus" class="footer-status warn">● waiting</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">YOLO 调试图</div>
        <div class="card-topic">/yolo/dbg_image</div>
      </div>
      <div class="viewer">
        <img id="yoloFrame" alt="YOLO Debug">
      </div>
      <div class="card-footer">
        <div>来源：yolo_snapshot.jpg</div>
        <div id="yoloStatus" class="footer-status warn">● waiting</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div>左侧：前置彩色相机</div>
    <div>右侧：YOLO 可视化调试图</div>
    <div>适合后续直接嵌入服务器 QT</div>
  </div>

  <script>
    const frontImg = document.getElementById("frontFrame");
    const yoloImg = document.getElementById("yoloFrame");

    const globalStatus = document.getElementById("globalStatus");
    const signalInfo = document.getElementById("signalInfo");

    const frontStatus = document.getElementById("frontStatus");
    const yoloStatus = document.getElementById("yoloStatus");

    const FRONT_URL = "http://127.0.0.1:8081/front_snapshot.jpg";
    const YOLO_URL = "http://127.0.0.1:8081/yolo_snapshot.jpg";

    // 100ms 太激进，先降到 150~200ms 更稳
    const FRONT_INTERVAL_MS = 150;
    const YOLO_INTERVAL_MS = 180;

    let lastFrontUrl = null;
    let lastYoloUrl = null;

    let frontAlive = false;
    let yoloAlive = false;

    function setOk(el, text) {
      el.textContent = text;
      el.className = el.className.replace("warn", "").trim() + " ok";
    }

    function setWarn(el, text) {
      el.textContent = text;
      el.className = el.className.replace("ok", "").trim() + " warn";
    }

    function updateGlobalStatus() {
      if (frontAlive && yoloAlive) {
        globalStatus.textContent = "● online";
        globalStatus.className = "pill ok";
        signalInfo.textContent = "signal: dual active";
      } else if (frontAlive || yoloAlive) {
        globalStatus.textContent = "● partial";
        globalStatus.className = "pill warn";
        signalInfo.textContent = "signal: partial";
      } else {
        globalStatus.textContent = "● no signal";
        globalStatus.className = "pill warn";
        signalInfo.textContent = "signal: offline";
      }
    }

    async function refreshOne(url, img, which) {
      try {
        const resp = await fetch(url + "?t=" + Date.now(), {
          cache: "no-store"
        });

        if (!resp.ok) {
          throw new Error(which + " HTTP " + resp.status);
        }

        const blob = await resp.blob();
        const objectUrl = URL.createObjectURL(blob);

        img.onload = () => {
          if (which === "front" && lastFrontUrl) {
            URL.revokeObjectURL(lastFrontUrl);
          }
          if (which === "yolo" && lastYoloUrl) {
            URL.revokeObjectURL(lastYoloUrl);
          }
        };
  
        img.src = objectUrl;
  
        if (which === "front") {
        lastFrontUrl = objectUrl;
          frontAlive = true;
          setOk(frontStatus, "● online");
        } else {
          lastYoloUrl = objectUrl;
          yoloAlive = true;
          setOk(yoloStatus, "● online");
        }
      } catch (e) {
        console.error(e);

        if (which === "front") {
          frontAlive = false;
          setWarn(frontStatus, "● no signal");
        } else {
          yoloAlive = false;
          setWarn(yoloStatus, "● no signal");
        }
      }

      updateGlobalStatus();
    }

    function startFrontLoop() {
      refreshOne(FRONT_URL, frontImg, "front");
      setInterval(() => {
        refreshOne(FRONT_URL, frontImg, "front");
      }, FRONT_INTERVAL_MS);
    }

    function startYoloLoop() {
      refreshOne(YOLO_URL, yoloImg, "yolo");
      setInterval(() => {
        refreshOne(YOLO_URL, yoloImg, "yolo");
      }, YOLO_INTERVAL_MS);
    }

    startFrontLoop();
    startYoloLoop();
  </script>
</body>
</html>
