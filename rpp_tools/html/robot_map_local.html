<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Robot Map Local</title>
  <script src="roslib.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: rgba(23,26,33,0.9);
      --border: #2d3445;
      --text: #e6edf3;
      --subtext: #9aa4b2;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
      --global: #22d3ee;
      --local: #ff9f1c;
      --goal: #7c9cff;
      --robot: #ff4d6d;
      --arrow: #ffd60a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
      background: linear-gradient(180deg, #0c0f14 0%, #11161d 100%);
      color: var(--text);
      overflow: hidden;
    }

    #topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(20,24,32,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
    }

    #subtitle {
      font-size: 11px;
      color: var(--subtext);
      margin-top: 2px;
    }

    #statusRow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(23,26,33,0.95);
      font-size: 13px;
      color: var(--subtext);
    }

    #status.connected { color: var(--ok); }
    #status.error { color: var(--err); }
    #status.closed { color: var(--warn); }

    #main {
      width: 100vw;
      height: calc(100vh - 52px);
      position: relative;
      overflow: hidden;
      background: #151a22;
    }

    #canvasWrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    #canvasWrap.dragging { cursor: grabbing; }

    canvas {
      display: block;
      background: #202632;
    }

    .card {
      position: absolute;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.28);
      backdrop-filter: blur(6px);
    }

    #infoCard {
      left: 10px;
      top: 10px;
      padding: 10px 12px;
      width: 250px;
      max-height: 180px;
      overflow-y: auto;
      background: rgba(23, 26, 33, 0.72);
      border: 1px solid rgba(45, 52, 69, 0.8);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      backdrop-filter: blur(4px);
    }

    #legendCard {
      right: 10px;
      top: 10px;
      padding: 8px 10px;
      font-size: 11px;
      color: var(--subtext);
      min-width: 135px;
      background: rgba(23, 26, 33, 0.72);
      border: 1px solid rgba(45, 52, 69, 0.8);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      backdrop-filter: blur(4px);
    }
    
    #helpCard {
      right: 10px;
      bottom: 10px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--subtext);
      background: rgba(23, 26, 33, 0.62);
      border: 1px solid rgba(45, 52, 69, 0.8);
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      backdrop-filter: blur(4px);
    }    
    
    #infoTitle {
      font-size: 12px;
      color: var(--subtext);
      margin-bottom: 6px;
    }

    #info {
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      color: var(--text);
    }

    .legendItem {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .legendLineGlobal {
      width: 24px;
      border-top: 3px solid var(--global);
    }

    .legendLineLocal {
      width: 24px;
      border-top: 3px solid var(--local);
    }

    .legendDotRobot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--robot);
      border: 2px solid #fff;
    }

    .legendGoal {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 16px solid var(--goal);
    }
    
     @media (max-width: 1200px) {
      #infoCard {
        width: 210px;
        max-height: 150px;
      }
    
      #legendCard {
        min-width: 120px;
      }
    
      #helpCard {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div>
      <div id="title">机器人地图监控</div>
      <div id="subtitle">位置 / 朝向 / 全局路径 / 局部路径 / 目标点 / 速度信息</div>
    </div>
    <div id="statusRow">
      <div id="status" class="pill closed">● loading</div>
      <div id="zoomInfo" class="pill">zoom: --</div>
      <div id="poseInfo" class="pill">pose: --</div>
    </div>
  </div>

  <div id="main">
    <div id="canvasWrap">
      <canvas id="mapCanvas"></canvas>

      <div id="infoCard" class="card">
        <div id="info">loading map ...</div>
      </div>

      <div id="legendCard" class="card">
        <div style="font-weight:700;color:#fff;">图例</div>
        <div class="legendItem"><div class="legendLineGlobal"></div><div>全局路径 /plan</div></div>
        <div class="legendItem"><div class="legendLineLocal"></div><div>局部路径 /local_plan</div></div>
        <div class="legendItem"><div class="legendDotRobot"></div><div>机器人位置</div></div>
        <div class="legendItem"><div class="legendGoal"></div><div>目标点 /goal_pose</div></div>
      </div>

      <div id="helpCard" class="card">
        滚轮：缩放<br>
        左键拖动：平移<br>
        双击：重置视图
      </div>
    </div>
  </div>

  <script>
    const MAP_META = {
      width: 4677,
      height: 2765,
      resolution: 0.05,
      origin: {
        x: -116.925,
        y: -69.125
      }
    };

    const statusEl = document.getElementById("status");
    const infoEl = document.getElementById("info");
    const zoomInfoEl = document.getElementById("zoomInfo");
    const poseInfoEl = document.getElementById("poseInfo");
    const wrap = document.getElementById("canvasWrap");
    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d");

    let ros = null;
    let mapImage = new Image();

    let amclPose = null;
    let odomPose = null;
    let lioPose = null;
    let lastAmclTs = 0;
    let lastOdomTs = 0;
    let lastLioTs = 0;

    let globalPlan = [];
    let localPlan = [];
    let goalPose = null;
    let cmdVel = null;

    let mapLoaded = false;
    let scale = 1.0;
    let minScale = 0.08;
    let maxScale = 10.0;
    let offsetX = 0;
    let offsetY = 0;

    let dragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    function nowSec() {
      return Date.now() / 1000.0;
    }

    function setStatus(text, cls) {
      statusEl.textContent = "● " + text;
      statusEl.className = "pill " + cls;
    }

    function worldToPixel(wx, wy) {
      const px = (wx - MAP_META.origin.x) / MAP_META.resolution;
      const py = MAP_META.height - (wy - MAP_META.origin.y) / MAP_META.resolution;
      return { x: px, y: py };
    }

    function yawFromQuaternion(q) {
      const siny_cosp = 2.0 * (q.w * q.z + q.x * q.y);
      const cosy_cosp = 1.0 - 2.0 * (q.y * q.y + q.z * q.z);
      return Math.atan2(siny_cosp, cosy_cosp);
    }

    function getBestRobotPose() {
      const t = nowSec();
      if (amclPose && (t - lastAmclTs) < 3.0) return { source: "amcl_pose", pose: amclPose };
      if (odomPose && (t - lastOdomTs) < 3.0) return { source: "odom", pose: odomPose };
      if (lioPose && (t - lastLioTs) < 3.0) return { source: "fastlio2/lio_odom", pose: lioPose };
      return null;
    }

    function resizeCanvas() {
      canvas.width = wrap.clientWidth;
      canvas.height = wrap.clientHeight;
      redraw();
    }

    function fitMapToView() {
      const sx = wrap.clientWidth / MAP_META.width;
      const sy = wrap.clientHeight / MAP_META.height;
      scale = Math.min(sx, sy) * 0.95;

      const drawW = MAP_META.width * scale;
      const drawH = MAP_META.height * scale;

      offsetX = (wrap.clientWidth - drawW) / 2;
      offsetY = (wrap.clientHeight - drawH) / 2;
    }

    function resetView() {
      fitMapToView();
      redraw();
    }

    function beginScene() {
      ctx.save();
      ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
    }

    function endScene() {
      ctx.restore();
    }

    function drawMap() {
      ctx.drawImage(mapImage, 0, 0, MAP_META.width, MAP_META.height);
    }

    function drawPath(path, color, widthPx) {
      if (!path || path.length < 2) return;

      ctx.save();
      ctx.beginPath();
      ctx.lineWidth = widthPx / scale;
      ctx.strokeStyle = color;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      let started = false;
      for (const poseStamped of path) {
        const p = poseStamped.pose.position;
        const pt = worldToPixel(p.x, p.y);
        if (!started) {
          ctx.moveTo(pt.x, pt.y);
          started = true;
        } else {
          ctx.lineTo(pt.x, pt.y);
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawGoal() {
      if (!goalPose) return;
      const pt = worldToPixel(goalPose.position.x, goalPose.position.y);

      ctx.save();
      const s = 18 / scale;
      ctx.beginPath();
      ctx.moveTo(pt.x, pt.y - s);
      ctx.lineTo(pt.x - s * 0.55, pt.y + s * 0.55);
      ctx.lineTo(pt.x + s * 0.55, pt.y + s * 0.55);
      ctx.closePath();
      ctx.fillStyle = "#7c9cff";
      ctx.fill();

      ctx.font = `${16 / scale}px Arial`;
      ctx.lineWidth = 4 / scale;
      ctx.strokeStyle = "rgba(0,0,0,0.75)";
      ctx.fillStyle = "#ffffff";
      ctx.strokeText("Goal", pt.x + 20 / scale, pt.y - 8 / scale);
      ctx.fillText("Goal", pt.x + 20 / scale, pt.y - 8 / scale);
      ctx.restore();
    }

    function drawRobot() {
      const best = getBestRobotPose();
      if (!best) return;

      const pose = best.pose;
      const pt = worldToPixel(pose.position.x, pose.position.y);
      const yaw = yawFromQuaternion(pose.orientation);

      const bodyRadius = 14 / scale;
      const ringRadius = 18 / scale;
      const arrowLen = 34 / scale;
      const wingLen = 10 / scale;

      ctx.save();

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, ringRadius, 0, Math.PI * 2);
      ctx.lineWidth = 3 / scale;
      ctx.strokeStyle = "rgba(255,255,255,0.95)";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, bodyRadius, 0, Math.PI * 2);
      ctx.fillStyle = "#ff4d6d";
      ctx.shadowColor = "rgba(255,77,109,0.45)";
      ctx.shadowBlur = 20 / scale;
      ctx.fill();

      const endX = pt.x + arrowLen * Math.cos(yaw);
      const endY = pt.y - arrowLen * Math.sin(yaw);

      ctx.beginPath();
      ctx.moveTo(pt.x, pt.y);
      ctx.lineTo(endX, endY);
      ctx.lineWidth = 4 / scale;
      ctx.strokeStyle = "#ffd60a";
      ctx.shadowColor = "rgba(255,214,10,0.4)";
      ctx.shadowBlur = 16 / scale;
      ctx.stroke();

      const leftX = endX - wingLen * Math.cos(yaw - Math.PI / 6);
      const leftY = endY + wingLen * Math.sin(yaw - Math.PI / 6);
      const rightX = endX - wingLen * Math.cos(yaw + Math.PI / 6);
      const rightY = endY + wingLen * Math.sin(yaw + Math.PI / 6);

      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(leftX, leftY);
      ctx.lineTo(rightX, rightY);
      ctx.closePath();
      ctx.fillStyle = "#ffd60a";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4 / scale, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.font = `${16 / scale}px Arial`;
      ctx.lineWidth = 4 / scale;
      ctx.strokeStyle = "rgba(0,0,0,0.8)";
      ctx.fillStyle = "#ffffff";
      ctx.strokeText(best.source, pt.x + 22 / scale, pt.y - 18 / scale);
      ctx.fillText(best.source, pt.x + 22 / scale, pt.y - 18 / scale);

      ctx.restore();
    }

    function redraw() {
      if (!canvas.width || !canvas.height || !mapLoaded) return;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      beginScene();
      drawMap();
      drawPath(globalPlan, "#22d3ee", 3);
      drawPath(localPlan, "#ff9f1c", 3);
      drawGoal();
      drawRobot();
      endScene();

      zoomInfoEl.textContent = `zoom: ${scale.toFixed(3)}`;

      const best = getBestRobotPose();
      if (best) {
        poseInfoEl.textContent =
          `${best.source}: (${best.pose.position.x.toFixed(3)}, ${best.pose.position.y.toFixed(3)})`;
      } else {
        poseInfoEl.textContent = "pose: none";
      }

      let txt =
        `地图尺寸: ${MAP_META.width} × ${MAP_META.height}\n` +
        `分辨率: ${MAP_META.resolution.toFixed(3)} m/pixel\n` +
        `原点: (${MAP_META.origin.x}, ${MAP_META.origin.y})\n` +
        `全局路径点数 /plan: ${globalPlan.length}\n` +
        `局部路径点数 /local_plan: ${localPlan.length}\n`;

      if (goalPose) {
        txt += `目标点 /goal_pose: (${goalPose.position.x.toFixed(3)}, ${goalPose.position.y.toFixed(3)})\n`;
      } else {
        txt += `目标点 /goal_pose: 未收到\n`;
      }

      if (cmdVel) {
        txt += `速度 /cmd_vel: vx=${cmdVel.linear.x.toFixed(3)}, vy=${cmdVel.linear.y.toFixed(3)}, wz=${cmdVel.angular.z.toFixed(3)}\n`;
      } else {
        txt += `速度 /cmd_vel: 未收到\n`;
      }

      if (amclPose) txt += `AMCL: 已收到\n`; else txt += `AMCL: 未收到\n`;
      if (odomPose) txt += `ODOM: 已收到\n`; else txt += `ODOM: 未收到\n`;
      if (lioPose) txt += `LIO ODOM: 已收到`; else txt += `LIO ODOM: 未收到`;

      infoEl.textContent = txt;
    }

    function connectRos() {
      ros = new ROSLIB.Ros({
        url: "ws://127.0.0.1:9090"
      });

      ros.on("connection", function() {
        setStatus("connected", "connected");
        subscribeTopics();
      });

      ros.on("error", function(error) {
        setStatus("error", "error");
        console.error(error);
      });

      ros.on("close", function() {
        setStatus("closed", "closed");
        setTimeout(connectRos, 2000);
      });
    }

    function subscribeTopics() {
      const amclTopic = new ROSLIB.Topic({
        ros: ros,
        name: "/amcl_pose",
        messageType: "geometry_msgs/PoseWithCovarianceStamped"
      });

      const odomTopic = new ROSLIB.Topic({
        ros: ros,
        name: "/odom",
        messageType: "nav_msgs/Odometry"
      });

      const lioOdomTopic = new ROSLIB.Topic({
        ros: ros,
        name: "/fastlio2/lio_odom",
        messageType: "nav_msgs/Odometry"
      });

      const planTopic = new ROSLIB.Topic({
        ros: ros,
        name: "/plan",
        messageType: "nav_msgs/Path"
      });

      const localPlanTopic = new ROSLIB.Topic({
        ros: ros,
        name: "/local_plan",
        messageType: "nav_msgs/Path"
      });

      const goalPoseTopic = new ROSLIB.Topic({
        ros: ros,
        name: "/goal_pose",
        messageType: "geometry_msgs/PoseStamped"
      });

      const cmdVelTopic = new ROSLIB.Topic({
        ros: ros,
        name: "/cmd_vel",
        messageType: "geometry_msgs/Twist"
      });

      amclTopic.subscribe(function(message) {
        amclPose = message.pose.pose;
        lastAmclTs = nowSec();
        redraw();
      });

      odomTopic.subscribe(function(message) {
        odomPose = message.pose.pose;
        lastOdomTs = nowSec();
        redraw();
      });

      lioOdomTopic.subscribe(function(message) {
        lioPose = message.pose.pose;
        lastLioTs = nowSec();
        redraw();
      });

      planTopic.subscribe(function(message) {
        globalPlan = message.poses || [];
        redraw();
      });

      localPlanTopic.subscribe(function(message) {
        localPlan = message.poses || [];
        redraw();
      });

      goalPoseTopic.subscribe(function(message) {
        goalPose = message.pose;
        redraw();
      });

      cmdVelTopic.subscribe(function(message) {
        cmdVel = message;
        redraw();
      });
    }

    function setupMouse() {
      wrap.addEventListener("mousedown", (e) => {
        dragging = true;
        wrap.classList.add("dragging");
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      window.addEventListener("mouseup", () => {
        dragging = false;
        wrap.classList.remove("dragging");
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        offsetX += dx;
        offsetY += dy;
        redraw();
      });

      wrap.addEventListener("wheel", (e) => {
        e.preventDefault();
        const mouseX = e.offsetX;
        const mouseY = e.offsetY;
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        const newScale = Math.max(minScale, Math.min(maxScale, scale * zoomFactor));
        if (newScale === scale) return;

        const worldX = (mouseX - offsetX) / scale;
        const worldY = (mouseY - offsetY) / scale;

        scale = newScale;
        offsetX = mouseX - worldX * scale;
        offsetY = mouseY - worldY * scale;
        redraw();
      }, { passive: false });

      wrap.addEventListener("dblclick", () => {
        resetView();
      });
    }

    function init() {
      setStatus("loading map", "closed");

      mapImage.onload = function() {
        mapLoaded = true;
        fitMapToView();
        resizeCanvas();
        setStatus("map loaded", "closed");
        connectRos();
      };

      mapImage.onerror = function() {
        setStatus("load failed", "error");
        infoEl.textContent = "cannot load map.png";
      };

      mapImage.src = "map.png?t=" + Date.now();

      setupMouse();
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
    }

    init();
  </script>
</body>
</html>
